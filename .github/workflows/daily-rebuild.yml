# Rebuild the website once a day so guide pages and the directories follow the Google Sheet
# (new guides get a page, guides who left lose theirs) even on days nobody edits the site.
# It asks Cloudflare Pages to rebuild through a "deploy hook" address, stored as the GitHub secret
# CF_DEPLOY_HOOK (Cloudflare → Workers & Pages → mckenzieguides → Settings → Build → Deploy hooks).
# Until that secret exists this does nothing. "Run workflow" on the Actions tab rebuilds on demand.
name: Daily rebuild
on:
  schedule:
    - cron: "17 12 * * *"   # every day around 4–5 AM Oregon time
  workflow_dispatch:
permissions: {}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Cloudflare Pages to rebuild
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_DEPLOY_HOOK secret not set yet; nothing to do."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Rebuild requested."
